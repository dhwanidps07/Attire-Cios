<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - ATTIRE CIOS</title>
  <style>
    /* Base and Background */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: url('abc.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: white;
      backdrop-filter: brightness(0.6) blur(2px);
    }

    .register-container {
      background: rgba(0, 0, 0, 0.7);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      width: 400px;
      animation: slideUp 1.5s ease forwards;
    }

    .logo-title {
      text-align: center;
      margin-bottom: 20px;
      animation: fadeIn 2s ease;
    }

    .logo-title img {
      width: 70px;
      height: auto;
      margin-bottom: 10px;
    }

    .logo-title h1 {
      font-size: 1.8rem;
      margin: 0;
    }

    .register-container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 500;
      font-size: 1.5rem;
      animation: popIn 2s ease;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
      animation: fadeInUp 2s ease;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .input-group input::placeholder {
      color: #ccc;
    }

    .input-group input:focus {
      background: rgba(255, 255, 255, 0.2);
    }

    .register-btn {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff89f3, #7b2ff7);
      font-size: 1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: background 0.4s, transform 0.3s;
      margin-top: 10px;
      animation: popIn 2s ease;
    }

    .register-btn:hover {
      background: linear-gradient(135deg, #7b2ff7, #f107a3);
      transform: scale(1.05);
    }

    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      animation: fadeIn 2.5s ease;
    }

    .links a {
      color: #ff89f3;
      text-decoration: none;
      transition: color 0.3s;
    }

    .links a:hover {
      color: #f107a3;
    }

    /* Animations */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 450px) {
      .register-container {
        width: 90%;
      }
    }
  </style>
</head>
<body>

<div class="register-container">
  <div class="logo-title">
    <img src="logo.jpg" alt="Attire Cios Logo">
    <h1>ATTIRE CIOS</h1>
  </div>
  <h2>Sign Up</h2>

  <form>
    <div class="input-group">
      <input type="text" placeholder="Full Name" required>
    </div>
    <div class="input-group">
      <input type="text" placeholder="Phone Number" required>
    </div>
    <div class="input-group">
      <input type="email" placeholder="Email Address" required>
    </div>
    <div class="input-group">
      <input type="password" placeholder="Password" required>
    </div>
    <div class="input-group">
      <input type="password" placeholder="Confirm Password" required>
    </div>
    <button type="submit" class="register-btn">Sign Up</button>
  </form>

  <div class="links">
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

</body>
</html>
