<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - ATTIRE CIOS</title>
  <style>
    /* Reset and body background */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: url('abc.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
      backdrop-filter: brightness(0.7);
    }

    /* Header */
    header {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideInTop 1s ease forwards;
    }

    .logo-title {
      display: flex;
      align-items: center;
    }

    .logo {
      width: 60px;
      height: auto;
      margin-right: 15px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0;
    }

    nav .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav .nav-links li {
      display: inline-block;
    }

    nav .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav .nav-links a:hover {
      color: #ff89f3;
    }

    /* Contact Section */
    .contact-section {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      animation: fadeIn 2s ease;
    }

    .contact-section h2 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 6px #000;
      animation: popIn 1.5s ease;
    }

    .contact-section p {
      font-size: 1.2rem;
      margin-bottom: 40px;
      max-width: 600px;
      line-height: 1.6;
      text-shadow: 1px 1px 4px #000;
    }

    form {
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 600px;
      animation: fadeInUp 2s ease;
    }

    input, textarea {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1rem;
      transition: background 0.3s;
    }

    input:focus, textarea:focus {
      background: rgba(255, 255, 255, 0.3);
      outline: none;
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      background: linear-gradient(135deg, #ff89f3, #7b2ff7);
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.4s;
    }

    button:hover {
      background: linear-gradient(135deg, #7b2ff7, #f107a3);
    }

    /* Footer */
    footer {
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 20px;
    }

    /* Animations */
    @keyframes slideInTop {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav .nav-links {
        flex-direction: column;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-title">
    <img src="logo.jpg" alt="Attire Cios Logo" class="logo">
    <h1>ATTIRE CIOS</h1>
  </div>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<main class="contact-section">
  <h2>Contact Us</h2>
  <p>Have a question or want to work with us?  
  Feel free to send us a message — we'd love to hear from you!</p>

  <form action="#">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea rows="5" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</main>

<footer>
  &copy; 2025 ATTIRE CIOS | Designed with ❤️
</footer>

</body>
</html>
