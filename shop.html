<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop - ATTIRE CIOS</title>
  <style>
    /* Background and basic styles */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-image: url('abc.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: white;
    }

    /* Header */
    header {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-title {
      display: flex;
      align-items: center;
    }

    .logo {
      width: 60px;
      height: auto;
      margin-right: 15px;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
      margin: 0;
    }

    nav .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav .nav-links li {
      display: inline-block;
    }

    nav .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav .nav-links a:hover {
      color: #d1c4e9;
    }

    /* Main content */
    .shop-section {
      padding: 60px 30px;
      text-align: center;
    }

    .shop-section h2 {
      font-size: 2.5rem;
      margin-bottom: 40px;
      text-shadow: 2px 2px 5px #000;
      animation: fadeInDown 1s ease;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-top: 20px;
    }

    .product-card {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.5s, background-color 0.3s;
      animation: fadeInUp 1s ease;
    }

    .product-card:hover {
      transform: scale(1.05);
      background-color: rgba(255, 255, 255, 0.2);
    }

    .product-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .product-card h3 {
      margin: 10px 0 5px;
      font-size: 1.3rem;
    }

    .product-card p {
      font-size: 1rem;
      margin: 5px 0 15px;
    }

    .btn {
      background-color: white;
      color: purple;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s, color 0.3s;
    }

    .btn:hover {
      background-color: purple;
      color: white;
    }

    /* Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>
<body>

<header>
  <div class="logo-title">
    <img src="logo.jpg" alt="Attire Cios Logo" class="logo">
    <h1>ATTIRE CIOS</h1>
  </div>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<main class="shop-section">
  <h2>Explore Our New Arrivals</h2>
  <div class="products">
    <div class="product-card">
      <img src="https://via.placeholder.com/300x250?text=Stylish+Dress" alt="Stylish Dress">
      <h3>Stylish Dress</h3>
      <p>$49.99</p>
      <button class="btn">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/300x250?text=Casual+Shirt" alt="Casual Shirt">
      <h3>Casual Shirt</h3>
      <p>$29.99</p>
      <button class="btn">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/300x250?text=Denim+Jacket" alt="Denim Jacket">
      <h3>Denim Jacket</h3>
      <p>$69.99</p>
      <button class="btn">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/300x250?text=Trendy+Jeans" alt="Trendy Jeans">
      <h3>Trendy Jeans</h3>
      <p>$39.99</p>
      <button class="btn">Add to Cart</button>
    </div>
  </div>
</main>

</body>
</html>
