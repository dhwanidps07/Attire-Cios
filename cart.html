<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart - ATTIRE CIOS</title>
  <style>
    /* Reset and background */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: url('abc.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
      backdrop-filter: brightness(0.7);
    }

    header {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideInTop 1s ease forwards;
    }

    .logo-title {
      display: flex;
      align-items: center;
    }

    .logo {
      width: 60px;
      height: auto;
      margin-right: 15px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0;
    }

    nav .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav .nav-links li {
      display: inline-block;
    }

    nav .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav .nav-links a:hover {
      color: #ff89f3;
    }

    .cart-section {
      flex-grow: 1;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 2s ease;
    }

    .cart-section h2 {
      font-size: 3rem;
      margin-bottom: 30px;
      text-shadow: 2px 2px 6px #000;
      animation: popIn 1.5s ease;
    }

    .cart-items {
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      animation: fadeInUp 2s ease;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .item-img {
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 10px;
      background-size: cover;
      background-position: center;
    }

    .item-details {
      text-align: left;
    }

    .item-details h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .item-details p {
      margin: 5px 0 0;
      font-size: 0.9rem;
    }

    .item-price {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .remove-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: crimson;
      border: none;
      color: white;
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .remove-btn:hover {
      background: darkred;
    }

    .total-amount {
      margin-top: 20px;
      font-size: 1.5rem;
      text-align: right;
      font-weight: bold;
    }

    .checkout-btn {
      margin-top: 30px;
      padding: 15px 40px;
      background: linear-gradient(135deg, #ff89f3, #7b2ff7);
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.4s;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .checkout-btn:hover {
      background: linear-gradient(135deg, #7b2ff7, #f107a3);
    }

    footer {
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      text-align: center;
      font-size: 0.9rem;
    }

    /* Animations */
    @keyframes slideInTop {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav .nav-links {
        flex-direction: column;
        margin-top: 10px;
      }

      .item-info {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-title">
    <img src="logo.jpg"alt="Attire Cios Logo" class="logo">
    <h1>ATTIRE CIOS</h1>
  </div>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<main class="cart-section">
  <h2>Your Cart</h2>

  <div class="cart-items" id="cartItems">
    <div class="cart-item" data-price="79.99">
      <div class="item-info">
        <div class="item-img" style="background-image: url('https://via.placeholder.com/60');"></div>
        <div class="item-details">
          <h3>Stylish Jacket</h3>
          <p>Size: M</p>
        </div>
      </div>
      <div class="item-price">$79.99</div>
      <button class="remove-btn" onclick="removeItem(this)">Remove</button>
    </div>

    <div class="cart-item" data-price="59.99">
      <div class="item-info">
        <div class="item-img" style="background-image: url('https://via.placeholder.com/60');"></div>
        <div class="item-details">
          <h3>Casual Sneakers</h3>
          <p>Size: 9</p>
        </div>
      </div>
      <div class="item-price">$59.99</div>
      <button class="remove-btn" onclick="removeItem(this)">Remove</button>
    </div>

    <div class="cart-item" data-price="99.99">
      <div class="item-info">
        <div class="item-img" style="background-image: url('https://via.placeholder.com/60');"></div>
        <div class="item-details">
          <h3>Elegant Dress</h3>
          <p>Size: S</p>
        </div>
      </div>
      <div class="item-price">$99.99</div>
      <button class="remove-btn" onclick="removeItem(this)">Remove</button>
    </div>
  </div>

  <div class="total-amount" id="totalAmount">
    Total: $239.97
  </div>

  <button class="checkout-btn">Proceed to Checkout</button>

</main>

<footer>
  &copy; 2025 ATTIRE CIOS | Designed with ❤️
</footer>

<script>
  function updateTotal() {
    let total = 0;
    document.querySelectorAll('.cart-item').forEach(item => {
      total += parseFloat(item.getAttribute('data-price'));
    });
    document.getElementById('totalAmount').innerText = 'Total: $' + total.toFixed(2);
  }

  function removeItem(button) {
    const item = button.parentElement;
    item.remove();
    updateTotal();
  }
</script>

</body>
</html>
